name: Import approved portfolio
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-approved-portfolio.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-portfolio-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch, verify and commit only the approved public files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, http.cookiejar, io, json, os, pathlib, stat, time, urllib.error, urllib.parse, urllib.request, zipfile
          REPO = 'jeonbyungryong/jby-portfolio'
          SHARE = 'https://1drv.ms/u/c/b377fcde1431cc70/IQDhWYuSQVcXS5Te_xGc_t-oAbBhoBa6-5aE2JMI9Ms8_QU'
          ZIP_SHA = '1ea95ea6ed9f9fd4a2c9c924d786dd2dbd343c0d09545fb4c95330643ca290fa'
          INVENTORY_SHA = 'f5d0a36a0f3a7ce02a20e53f576fb222446fc693d7bbb9826f415360ff0c7e6d'
          ZIP_SIZE = 13910042
          MAX_BYTES = 25 * 1024 * 1024
          if os.environ.get('GITHUB_REPOSITORY') != REPO or os.environ.get('GITHUB_REF') != 'refs/heads/main':
              raise SystemExit('Wrong repository or branch')
          def gh(method, endpoint, data=None):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + endpoint,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'JBY-Approved-Portfolio-Import','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=45) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError('GitHub '+method+' '+endpoint+' returned '+str(error.code)) from None
          head=gh('GET','/git/ref/heads/main')['object']['sha']
          if head != os.environ['EXPECTED_HEAD']: raise SystemExit('Main changed; refusing stale import')
          baseline=gh('GET','/git/commits/'+head)
          oldtree=gh('GET','/git/trees/'+baseline['tree']['sha']+'?recursive=1')
          if oldtree.get('truncated'): raise SystemExit('Incomplete existing tree')
          if any(x['path'].startswith('docs/') for x in oldtree['tree']):
              raise SystemExit('Existing website must be reviewed before replacement')
          def microsoft_url(url):
              u=urllib.parse.urlsplit(url); h=(u.hostname or '').lower()
              if u.scheme!='https' or u.username or u.password or u.port not in (None,443): return False
              return h=='1drv.ms' or any(h==s or h.endswith('.'+s) for s in ('live.com','onedrive.com','microsoftpersonalcontent.com','sharepoint.com','microsoft.com','1drv.com','files.1drv.com'))
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if not microsoft_url(newurl): raise ValueError('Unexpected transfer redirect host')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SafeRedirect(),urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          encoded='u!'+base64.urlsafe_b64encode(SHARE.encode()).decode().rstrip('=')
          candidates=[('shared-download',SHARE+'?download=1'),('shared-content','https://api.onedrive.com/v1.0/shares/'+encoded+'/root/content')]
          raw=None
          for label,url in candidates:
              if not microsoft_url(url): raise SystemExit('Unapproved transfer host')
              try:
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 JBY-Portfolio-Approved-Transfer'}),timeout=60) as r:
                      final=r.geturl(); data=r.read(MAX_BYTES+1)
                      print(json.dumps({'transfer':label,'status':r.status,'type':r.headers.get('Content-Type','').split(';')[0],'bytes':len(data),'host':urllib.parse.urlsplit(final).hostname}))
                  if len(data)==ZIP_SIZE and hashlib.sha256(data).hexdigest()==ZIP_SHA:
                      raw=data; break
                  if label=='shared-download' and urllib.parse.urlsplit(final).hostname not in ('login.live.com','login.microsoftonline.com'):
                      u=urllib.parse.urlsplit(final); q=urllib.parse.parse_qs(u.query); q['download']=['1']
                      derived=urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,urllib.parse.urlencode(q,doseq=True),''))
                      if derived!=url and microsoft_url(derived): candidates.append(('resolved-shared-download',derived))
              except urllib.error.HTTPError as e: print(json.dumps({'transfer':label,'status':e.code}))
              except (OSError,urllib.error.URLError,ValueError) as e: print(json.dumps({'transfer':label,'error':type(e).__name__}))
          if raw is None: raise SystemExit('Approved ZIP download not verified; no portfolio files written')
          files={}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              info=archive.infolist()
              if len(info)!=45 or sum(x.file_size for x in info)>20*1024*1024: raise SystemExit('Archive inventory size mismatch')
              for x in info:
                  name=x.filename; p=pathlib.PurePosixPath(name); mode=(x.external_attr>>16)&0o170000
                  if x.is_dir() or name in files or p.is_absolute() or '..' in p.parts or str(p)!=name or any(c in name for c in ('\\',':','\0')): raise SystemExit('Unsafe archive entry')
                  if mode not in (0,stat.S_IFREG) or x.flag_bits&1: raise SystemExit('Nonregular/encrypted archive entry')
                  if name!='README.md' and not name.startswith('docs/'): raise SystemExit('Unexpected archive file')
                  if name not in ('README.md','docs/.nojekyll','docs/index.html','docs/404.html','docs/portfolio.pdf') and not (name.startswith('docs/assets/') and p.suffix in ('.png','.webp','.css','.js')): raise SystemExit('Unexpected public file type')
                  files[name]=archive.read(x)
          inventory='\n'.join(name+'\t'+str(len(data))+'\t'+hashlib.sha256(data).hexdigest() for name,data in sorted(files.items()))
          if hashlib.sha256(inventory.encode()).hexdigest()!=INVENTORY_SHA: raise SystemExit('Complete inventory hash mismatch')
          html=files['docs/index.html'].decode('utf-8')
          if 'monitor-mini-ess' not in html or '010-2572-****' not in html or '경기도 수원시' not in html: raise SystemExit('Approved content markers absent')
          print(json.dumps({'zip_verified':True,'website_files':44,'website_bytes':sum(len(d) for n,d in files.items() if n.startswith('docs/')),'inventory_verified':True}))
          entries=[]
          for name,data in sorted(files.items()):
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              blob=gh('POST','/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              if blob['sha']!=expected: raise SystemExit('Uploaded blob mismatch: '+name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          tree=gh('POST','/git/trees',{'base_tree':baseline['tree']['sha'],'tree':entries})
          remote=gh('GET','/git/trees/'+tree['sha']+'?recursive=1')
          if remote.get('truncated'): raise SystemExit('Incomplete uploaded tree')
          byname={x['path']:x for x in remote['tree'] if x['type']=='blob'}
          for e in entries:
              r=byname.get(e['path'],{})
              if r.get('sha')!=e['sha'] or r.get('size')!=len(files[e['path']]): raise SystemExit('Remote file verification failed')
          if gh('GET','/git/ref/heads/main')['object']['sha']!=head: raise SystemExit('Main changed before commit; uploaded blobs left unreferenced')
          commit=gh('POST','/git/commits',{'message':'Publish approved 21-section portfolio files\n\nImport the exact user-approved redacted website and PDF. All 45 file sizes and Git blob hashes verified before main update. No raw PPT, notes, original private assets, font files, credentials or transfer ZIP included. Pages activation is a separate step.','tree':tree['sha'],'parents':[head]})
          gh('PATCH','/git/refs/heads/main',{'sha':commit['sha'],'force':False})
          if gh('GET','/git/ref/heads/main')['object']['sha']!=commit['sha']: raise SystemExit('Main recheck failed')
          print(json.dumps({'transfer_complete':True,'commit':commit['sha'],'verified_files':45,'website_files':44,'zip_sha256':ZIP_SHA,'pages_activated':False}))
          PY
