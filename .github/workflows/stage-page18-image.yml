name: Stage approved page-18 update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage-page18-image.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'jeonbyungryong/jby-portfolio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify and stage four authorized public files without updating main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, http.cookiejar, io, json, os, pathlib, stat, urllib.request, zipfile
          REPO='jeonbyungryong/jby-portfolio'
          SHARE='https://1drv.ms/u/c/b377fcde1431cc70/IQAhX5vZ5nsKTIammvvlIRSfAQtAPRRoUb_ayksEAqN0yf0'
          ZIP_SHA='7f626889483aa17f15b115039c9d602bc5a22adbc46a635407f3ba7d9c0ef5ec'
          OLD='69bc5e2bd3c1e7995fcaf80396d2bef608c819d4'
          NEW='941bfdbcf7fafca10ea5755048557c5a923db90a'
          EXPECTED={
           'docs/index.html':'0f50026d88b9126c3c7c4e84dd7919edf361a9fc0973d6165b32c2f45ca81110',
           'docs/portfolio.pdf':'ba1a3060e1db7dcbd9a1251b52650763f001c9c3a1cf8608a0d24f803bb25f72',
           'docs/assets/s18-img01-bab5359d5162afc1.webp':'bab5359d5162afc1af5b5333c207c9bbb72d6e39bfb9b36636d78b030664c57c',
           'docs/assets/s18-img01-full-a1077738100c505f.png':'a1077738100c505f2137ac393f6b8711a43eac4b16d8e59fa799760d84f1cf05'}
          DELETE=['docs/assets/s18-img01-57e9e3de915b2f1a.webp','docs/assets/s18-img01-full-c1e38005ab0f5e04.png']
          if os.environ['GITHUB_REPOSITORY']!=REPO or os.environ['GITHUB_REF']!='refs/heads/main':raise SystemExit('Wrong destination')
          def gh(method,tail,data=None):
           req=urllib.request.Request('https://api.github.com/repos/'+REPO+tail,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'JBY-Page18-Update'})
           with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          head=gh('GET','/git/ref/heads/main')['object']['sha']
          if head!=os.environ['GITHUB_SHA']:raise SystemExit('Main changed')
          base=gh('GET','/git/commits/'+head)['tree']['sha']
          root=gh('GET','/git/trees/'+base)
          if next(e['sha'] for e in root['tree'] if e['path']=='docs')!=OLD:raise SystemExit('Baseline website differs')
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            from urllib.parse import urlsplit
            u=urlsplit(newurl);h=(u.hostname or '').lower()
            if u.scheme!='https' or u.username or u.password or not (h=='1drv.ms' or any(h==d or h.endswith('.'+d) for d in ['live.com','onedrive.com','1drv.com','microsoftpersonalcontent.com','sharepoint.com'])):raise ValueError('Unexpected transfer host')
            return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SafeRedirect(),urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          with opener.open(urllib.request.Request(SHARE+'?download=1',headers={'User-Agent':'Mozilla/5.0 JBY-Portfolio-Approved-Transfer'}),timeout=60) as r:
           raw=r.read(4*1024*1024+1)
          if len(raw)!=3367385 or hashlib.sha256(raw).hexdigest()!=ZIP_SHA:raise SystemExit('Transfer ZIP mismatch')
          files={}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           if len(z.infolist())!=4 or sum(i.file_size for i in z.infolist())>8*1024*1024:raise SystemExit('Unexpected inventory')
           for i in z.infolist():
            name=i.filename
            if name not in EXPECTED or name in files or i.is_dir() or i.flag_bits&1 or (i.external_attr>>16)&0o170000 not in (0,stat.S_IFREG):raise SystemExit('Unexpected archive member')
            data=z.read(i)
            if hashlib.sha256(data).hexdigest()!=EXPECTED[name]:raise SystemExit('Asset bytes differ')
            files[name]=data
          entries=[]
          for name,data in sorted(files.items()):
           sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           blob=gh('POST','/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
           if blob['sha']!=sha:raise SystemExit('Uploaded blob differs')
           entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          entries += [{'path':n,'mode':'100644','type':'blob','sha':None} for n in DELETE]
          result=gh('POST','/git/trees',{'base_tree':base,'tree':entries})
          checked=gh('GET','/git/trees/'+result['sha'])
          if next(e['sha'] for e in checked['tree'] if e['path']=='docs')!=NEW:raise SystemExit('Candidate tree mismatch')
          if gh('GET','/git/ref/heads/main')['object']['sha']!=head:raise SystemExit('Main changed while staging')
          print('STAGE_RESULT '+json.dumps({'base_head':head,'root_tree':result['sha'],'docs_tree':NEW,'files_verified':4,'unchanged_website_files':40,'main_updated':False,'verified':True}))
          PY
