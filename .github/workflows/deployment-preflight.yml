name: Verify portfolio publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deployment-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    if: github.repository == 'jeonbyungryong/jby-portfolio'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify approved files and actual publication state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, urllib.error, urllib.request
          repo='jeonbyungryong/jby-portfolio'
          api='https://api.github.com/repos/'+repo
          expected_docs='69bc5e2bd3c1e7995fcaf80396d2bef608c819d4'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'JBY-Publication-Verification'}
          def get_json(path):
              with urllib.request.urlopen(urllib.request.Request(api+path,headers=headers),timeout=25) as response:
                  return json.load(response)
          repository=get_json('')
          if repository['private']: raise SystemExit('Results repository is not public')
          head=get_json('/git/ref/heads/main')['object']['sha']
          root=get_json('/git/trees/'+head)
          docs=next((x for x in root['tree'] if x['path']=='docs'),None)
          if not docs or docs['sha']!=expected_docs: raise SystemExit('Approved docs tree differs')
          tree=get_json('/git/trees/'+expected_docs+'?recursive=1')
          files=[x for x in tree['tree'] if x['type']=='blob']
          if tree.get('truncated') or len(files)!=44: raise SystemExit('Incomplete website inventory')
          def verify_file(item):
              url='https://raw.githubusercontent.com/'+repo+'/'+head+'/docs/'+item['path']
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'JBY-Anonymous-File-Verification'}),timeout=30) as response:
                  data=response.read(10*1024*1024)
                  if response.status!=200: raise ValueError('File HTTP failure')
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if digest!=item['sha'] or len(data)!=item['size']: raise ValueError('Downloaded file differs: '+item['path'])
              return len(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              sizes=list(pool.map(verify_file,files))
          results={'repository':repo,'head':head,'docs_tree':expected_docs,'anonymous_files_verified':len(sizes),'website_bytes':sum(sizes),'read_only':True}
          try:
              pages=get_json('/pages')
              results['pages']={'status':200,'source':pages.get('source'),'build_type':pages.get('build_type'),'html_url':pages.get('html_url'),'https_enforced':pages.get('https_enforced')}
          except urllib.error.HTTPError as error: results['pages']={'status':error.code}
          url='https://jeonbyungryong.github.io/jby-portfolio/'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'JBY-Publication-Verification'}),timeout=30) as response:
                  data=response.read(1024*1024)
                  index=next(x for x in files if x['path']=='index.html')
                  digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  results['website']={'status':response.status,'approved_index_matches':digest==index['sha'],'url':url}
          except urllib.error.HTTPError as error: results['website']={'status':error.code,'url':url}
          results['publication_verified']=results.get('website',{}).get('status')==200 and results['website'].get('approved_index_matches',False)
          print(json.dumps(results,ensure_ascii=False,sort_keys=True))
          PY
