name: Deployment transport check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deployment-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  inspect:
    if: github.repository == 'jeonbyungryong/jby-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check approved deployment services without changing them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, socket, urllib.error, urllib.request
          repo = 'jeonbyungryong/jby-portfolio'
          results = {'mode': 'read-only', 'published': False}
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'JBY-Portfolio-Deployment-Preflight'
          }
          for label, endpoint in [('repository', ''), ('pages', '/pages')]:
              request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = json.load(response)
                      results[label] = {'status': response.status}
                      if label == 'repository':
                          results[label].update({'name': body.get('full_name'), 'private': body.get('private')})
                      else:
                          results[label].update({'build_type': body.get('build_type'), 'html_url': body.get('html_url'), 'source': body.get('source')})
              except urllib.error.HTTPError as error:
                  results[label] = {'status': error.code}
              except (OSError, urllib.error.URLError) as error:
                  results[label] = {'error_type': type(error).__name__}
          try:
              results['transfer_service_dns'] = bool(socket.getaddrinfo('onedrive.live.com', 443))
          except OSError:
              results['transfer_service_dns'] = False
          print(json.dumps(results, ensure_ascii=False, sort_keys=True))
          if results['repository'].get('status') != 200:
              raise SystemExit('Repository read failed')
          PY
